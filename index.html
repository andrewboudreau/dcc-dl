<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCC: Dragon's Lair</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud">
    <span id="lives" aria-label="Lives"></span>
    <span id="scene-name"></span>
    <span>Score <b id="score">0</b></span>
  </header>

  <main id="stage" data-phase="title">
    <h1 id="title"></h1>
    <p id="text"></p>
    <div id="cue" aria-live="assertive"></div>
    <div id="timer"><div id="timer-fill"></div></div>
    <p id="prompt"></p>
  </main>

  <nav class="pad" aria-label="Touch controls">
    <button data-input="up" class="up">↑</button>
    <button data-input="left" class="left">←</button>
    <button data-input="action" class="action">✊</button>
    <button data-input="right" class="right">→</button>
    <button data-input="down" class="down">↓</button>
  </nav>

  <script type="module" src="src/main.js"></script>
</body>
</html>
